# my-ai-workflow rules
rules:
  proposal:
    - "Capabilities 절의 스펙 이름은 openspec/specs 아래 경로 전체로 적는다 (예: phase1/order-service/checkout)."
    - "건드리는 앱과 인터페이스의 담당자를 workflow.json에서 찾아 Impact 절에 적는다."
  specs:
    - "요구사항 제목은 ID로 시작하고, 제목 바로 아래에 상태 줄을 둔다. 새 ID는 `aiwf next-id`로 받는다."
    - "요구사항 본문은 관찰할 수 있는 동작 한 가지만 적는다. 값(시간, 한계)은 constants.yaml의 키로 가리킨다."
    - "Scenario는 요구사항당 판정 조건 한두 개만 둔다. 구체적인 값과 경계 사례는 openspec/tests의 .feature에 쓴다."
    - "코드나 기존 문서에서 확인하지 못한 내용은 쓰지 않는다. 확인이 필요한 곳은 '미확인'으로 시작하는 줄로 남긴다."
  design:
    - "변경 하나를 넘어 유효한 결정은 `aiwf add decision <제목>`으로 openspec/project/decisions에 남기고 ID로 가리킨다."
  tasks:
    - "작업 묶음(## 절) 하나는 계약 · 시나리오 · 코드 · 테스트를 끝까지 관통하는 세로 조각이다. ADDED · MODIFIED 요구사항 ID마다 그 ID를 적은 묶음이 정확히 하나 있다."
    - "묶음 제목 아래 첫 줄에 먼저 끝나야 하는 묶음을 `선행: 1, 2` 또는 `선행: 없음`으로 적는다."
    - "묶음 안의 순서는 계약 수정, 실패하는 시나리오 · 테스트, 구현, 통과 확인이다. 호환이 깨지는 계약 변경은 새 형태 추가, 호출부 이동, 옛 형태 삭제의 세 묶음으로 나눈다."
    - "요구사항이 바뀌면 openspec/tests의 해당 .feature를 고치는 작업을 넣는다."
    - "인터페이스가 바뀌면 계약 파일 수정과 info.version 올림을 코드 작업보다 앞에 둔다."
    - "첫 작업은 `aiwf check --gate <change>` 통과 확인이고, 마지막 작업은 `aiwf check` 통과 확인이다."
    - "구현하면서 요구사항 상태를 implemented로 바꾸고, 코드 주석과 자동 테스트에 ID를 단다."
    - "archive로 새 spec.md가 생기면 Purpose 절의 자리표시를 그 기능의 목적 한 문단으로 바꾸는 작업을 넣는다."
